apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: craftista-root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Evatee-coder/eks-microservices-gitops-platform
    #targetRevision: prod
    targetRevision: main
    path: microservices-k8s/k8s-manifests/argocd-apps
    directory:
      recurse: true
      exclude: 'apps/*'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   























































































































































































































































































































































































































































































                                                                                  
