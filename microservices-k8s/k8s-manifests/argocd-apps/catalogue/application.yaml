apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalogue
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Evatee-coder/eks-microservices-gitops-platform   
    #targetRevision: prod
    targetRevision: main #--- IGNORE ---
    path: microservices-k8s/k8s-manifests
    directory:
      include: '03-catalogue-deployment.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: craftica
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
